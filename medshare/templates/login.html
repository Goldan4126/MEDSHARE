{% extends 'base.html' %}
{% block content %}
{% set labels = {'patient': 'User', 'seller': 'Seller', 'admin': 'Admin'} %}
<div class="container py-4">
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card form-card">
      <div class="card-body p-4">
        <nav class="login-tabs" aria-label="Choose account type">
          <a class="login-tab {% if role == 'patient' %}active{% endif %}" href="{{ url_for('login') }}"{% if role == 'patient' %} aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>User
          </a>
          <a class="login-tab {% if role == 'seller' %}active{% endif %}" href="{{ url_for('seller_login') }}"{% if role == 'seller' %} aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>Seller
          </a>
          <a class="login-tab {% if role == 'admin' %}active{% endif %}" href="{{ url_for('admin_login') }}"{% if role == 'admin' %} aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Admin
          </a>
        </nav>
        <div class="auth-head">
          <h3>{{ title }}</h3>
          <p>{{ subtitle }}</p>
        </div>
        <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" autocomplete="username" value="{{ (form or {}).get('email', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="pw-wrap">
              <input type="password" name="password" id="loginPassword" class="form-control" autocomplete="current-password" required>
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" id="eyeShow" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg viewBox="0 0 24 24" id="eyeHide" aria-hidden="true" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <button class="btn btn-success w-100">Login as {{ labels[role] }}</button>
        </form>
        {% if role != 'admin' %}
        <p class="mt-3 mb-0 text-center">New here? <a href="{{ url_for('register') }}">Register</a></p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
</div>

<script>
(function () {
  var input = document.getElementById('loginPassword');
  var btn = document.getElementById('pwToggle');
  var show = document.getElementById('eyeShow');
  var hide = document.getElementById('eyeHide');
  btn.addEventListener('click', function () {
    var reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    show.style.display = reveal ? 'none' : '';
    hide.style.display = reveal ? '' : 'none';
    btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    btn.setAttribute('aria-pressed', reveal ? 'true' : 'false');
    input.focus();
  });
})();
</script>
{% endblock %}
