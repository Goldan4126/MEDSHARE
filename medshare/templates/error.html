{% extends 'base.html' %}
{% block title %} - {{ title }}{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="empty-state">
    <div class="icon">{% if code == 404 %}🔍{% elif code == 403 %}🔒{% else %}⚠️{% endif %}</div>
    <h5>{{ code }} &middot; {{ title }}</h5>
    <p>{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-success mt-3">Go to Homepage</a>
  </div>
</div>
{% endblock %}
